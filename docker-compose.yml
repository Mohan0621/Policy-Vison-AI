version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:7860"
    environment:
      - SESSION_BACKEND=memory
      - LLM_BACKEND=heuristic
      - IMAGE_BACKEND=pillow_canvas
    volumes:
      - ./backend/file_cache:/app/file_cache
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

